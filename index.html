<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LỊCH TRỰC TÒA SOẠN TỔNG HỢP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #EEF1F5;
      --ink: #141C26;
      --muted: #667488;
      --faint: #9AA6B4;
      --surface: #FFFFFF;
      --line: #DCE2EA;
      --line-strong: #C3CCD6;
      --accent: #243FB0;
      --accent-soft: #E6EAF8;
      --amber: #C9821E;
      --amber-soft: #FBEFDA;
      --danger: #B4413C;
      --weekend: #8C5A2B;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(20, 28, 38, .05), 0 8px 24px rgba(20, 28, 38, .08);
      --mono: 'Space Mono', ui-monospace, Menlo, monospace;
      --sans: 'Be Vietnam Pro', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      padding: 0
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5
    }

    button {
      font-family: inherit;
      cursor: pointer
    }

    :focus-visible {
      outline: 2.5px solid var(--accent);
      outline-offset: 2px;
      border-radius: 6px
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 20px 80px
    }

    header.app {
      margin-bottom: 18px
    }

    .brand .logo {
      height: 30px;
      width: auto;
      display: block;
      margin-bottom: 9px
    }

    .brand h1 {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -.4px;
      margin: 0
    }

    .brand p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 13.5px
    }

    .connbar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      margin: 14px 0;
      padding: 9px 13px;
      border-radius: 10px;
      border: 1px solid var(--line)
    }

    .connbar .cdot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex: none
    }

    .connbar.st-view {
      background: var(--accent-soft);
      border-color: #C6D0F2;
      color: #243FB0
    }

    .connbar.st-view .cdot {
      background: #243FB0
    }

    .connbar.st-local {
      background: #FBEFDA;
      border-color: #EAD3A8;
      color: #8a5a12
    }

    .connbar.st-local .cdot {
      background: var(--amber)
    }

    .connbar.st-error {
      background: #FBECEB;
      border-color: #EBC7C4;
      color: #8a2f2a
    }

    .connbar.st-error .cdot {
      background: var(--danger)
    }

    .connbar .cmsg {
      flex: 1
    }

    .connbar .csync {
      font-weight: 600;
      opacity: .8;
      font-size: 12px
    }

    .monthbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap
    }

    .monthbar .title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -.3px
    }

    .monthbar .nav {
      display: flex;
      align-items: center;
      gap: 6px
    }

    .btn {
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--ink);
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: .15s;
      white-space: nowrap
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent)
    }

    .btn svg {
      width: 16px;
      height: 16px;
      stroke-width: 2
    }

    .iconbtn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      display: grid;
      place-items: center;
      color: var(--ink);
      transition: .15s
    }

    .iconbtn:hover {
      border-color: var(--accent);
      color: var(--accent)
    }

    .iconbtn svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.2
    }

    .cal {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden
    }

    .dow {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-bottom: 1px solid var(--line)
    }

    .dow span {
      padding: 10px 0;
      text-align: center;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .6px;
      color: var(--muted);
      text-transform: uppercase
    }

    .dow span.we {
      color: var(--weekend)
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr)
    }

    .cell {
      position: relative;
      min-height: 118px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 8px 8px 6px;
      text-align: left;
      background: var(--surface);
      transition: background .12s;
      display: flex;
      flex-direction: column;
      gap: 5px
    }

    .cell:nth-child(7n) {
      border-right: none
    }

    .cell:hover:not(.blank) {
      background: #F7F9FC
    }

    .cell.blank {
      background: #F4F6F9;
      cursor: default
    }

    .daytop {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 4px
    }

    .cell .num {
      font-family: var(--mono);
      font-size: 24px;
      font-weight: 700;
      color: var(--ink);
      line-height: .9;
      letter-spacing: -.5px
    }

    .cell .lunar {
      font-size: 10.5px;
      color: var(--faint);
      font-weight: 600;
      white-space: nowrap;
      line-height: 1
    }

    .cell .lunar.first {
      color: var(--amber)
    }

    .cell.we .num {
      color: var(--weekend)
    }

    .cell.we .lunar {
      color: var(--weekend);
      opacity: .75
    }

    .cell.today .num {
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      padding: 2px 7px;
      margin: -2px 0 0 -2px
    }

    .cell-issue {
      align-self: flex-start;
      font-size: 10px;
      font-weight: 700;
      color: #9a6412;
      background: var(--amber-soft);
      border: 1px solid #EAD3A8;
      padding: 1px 6px;
      border-radius: 5px;
      line-height: 1.5
    }

    .cell-holiday {
      align-self: stretch;
      font-size: 9.5px;
      font-weight: 700;
      line-height: 1.2;
      padding: 2px 5px;
      border-radius: 5px;
      white-space: normal;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden
    }

    .cell-holiday.h {
      color: #a3242b;
      background: #FBE3E1
    }

    .cell-holiday.e {
      color: #243FB0;
      background: #E6EAF8
    }

    .nomeet-tag {
      margin-top: auto;
      background: var(--danger);
      color: #fff;
      font-size: 10.5px;
      font-weight: 700;
      line-height: 1.2;
      padding: 3px 6px;
      border-radius: 6px;
      text-align: center
    }

    .hasdot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--amber);
      position: absolute;
      bottom: 9px;
      left: 9px
    }

    dialog {
      border: none;
      border-radius: 16px;
      padding: 0;
      box-shadow: 0 24px 70px rgba(15, 22, 32, .32);
      max-width: 600px;
      width: calc(100% - 32px)
    }

    dialog::backdrop {
      background: rgba(20, 28, 38, .45)
    }

    .dvhead {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 20px 22px 16px;
      background: linear-gradient(135deg, #243FB0, #1B2E7E);
      color: #fff;
      border-radius: 16px 16px 0 0
    }

    .dvdate {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -.3px
    }

    .dvlunar {
      font-size: 13.5px;
      opacity: .85;
      margin-top: 3px;
      font-weight: 500
    }

    .dvclose {
      border: none;
      background: rgba(255, 255, 255, .16);
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      flex: none
    }

    .dvclose:hover {
      background: rgba(255, 255, 255, .28)
    }

    .dvclose svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.2
    }

    .dvbody {
      padding: 8px 22px 22px;
      max-height: 64vh;
      overflow: auto
    }

    .dv-grp {
      margin-top: 18px
    }

    .dv-grp .dv-gh {
      display: flex;
      align-items: center;
      gap: 9px;
      padding-bottom: 7px;
      margin-bottom: 4px;
      border-bottom: 2px solid
    }

    .dv-grp .dv-gh .dot {
      width: 11px;
      height: 11px;
      border-radius: 3px
    }

    .dv-grp .dv-gh .gn {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .6px;
      text-transform: uppercase
    }

    .dv-issue {
      background: var(--amber-soft);
      border: 1px solid #EAD3A8;
      color: #8a5a12;
      border-radius: 9px;
      padding: 8px 13px;
      font-size: 14px;
      margin: 2px 0 8px
    }

    .dv-issue b {
      font-size: 17px;
      font-weight: 800;
      color: #9a6412
    }

    .dv-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      padding: 9px 2px;
      border-bottom: 1px solid var(--line)
    }

    .dv-row:last-child {
      border-bottom: none
    }

    .dv-pos {
      font-size: 14px;
      color: var(--muted);
      font-weight: 600;
      flex: none;
      max-width: 48%
    }

    .dv-person {
      font-size: 17px;
      font-weight: 700;
      text-align: right;
      color: var(--ink)
    }

    .dv-person.empty {
      font-size: 14px;
      font-weight: 500;
      color: var(--faint);
      font-style: italic
    }

    .dv-nomeet {
      margin-top: 14px;
      background: var(--danger);
      color: #fff;
      border-radius: 12px;
      padding: 13px 16px
    }

    .dv-nomeet .t {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .3px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .dv-nomeet .t svg {
      width: 19px;
      height: 19px;
      stroke-width: 2.4
    }

    .dv-nomeet .r {
      font-size: 13.5px;
      margin-top: 5px;
      opacity: .95;
      line-height: 1.5
    }

    .dv-holiday {
      border-radius: 11px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 9px
    }

    .dv-holiday .dot2 {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex: none
    }

    .dv-holiday.h {
      background: #FBE3E1;
      color: #a3242b
    }

    .dv-holiday.h .dot2 {
      background: #a3242b
    }

    .dv-holiday.e {
      background: #E6EAF8;
      color: #243FB0
    }

    .dv-holiday.e .dot2 {
      background: #243FB0
    }

    .dv-note {
      margin-top: 18px;
      background: #FFF9EC;
      border: 1px solid #F0DFBD;
      border-radius: 11px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-line;
      overflow-wrap: anywhere
    }

    .dv-note b {
      display: block;
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--amber);
      margin-bottom: 4px
    }

    .dv-empty {
      text-align: center;
      padding: 30px 10px;
      color: var(--faint);
      font-size: 15px
    }

    .dvfoot {
      padding: 14px 22px;
      border-top: 1px solid var(--line);
      display: flex
    }

    .dvfoot .btn {
      flex: 1;
      justify-content: center
    }

    .gate {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: linear-gradient(160deg, #EEF1F5, #DEE4EE);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px
    }

    .gate-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(20, 28, 38, .18);
      padding: 30px 26px;
      width: 100%;
      max-width: 360px;
      text-align: center
    }

    .gate-logo {
      height: 30px;
      width: auto;
      margin-bottom: 14px
    }

    .gate-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -.2px;
      color: var(--ink);
      margin-bottom: 20px
    }

    .gate-checking {
      color: var(--muted);
      font-size: 14px;
      padding: 10px 0
    }

    .gate-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 10px
    }

    .gate-input {
      width: 100%;
      text-align: center;
      font-family: var(--mono);
      font-size: 26px;
      letter-spacing: 10px;
      font-weight: 700;
      border: 1.5px solid var(--line-strong);
      border-radius: 11px;
      padding: 12px 10px;
      background: #FBFCFD;
      color: var(--ink)
    }

    .gate-input:focus {
      outline: none;
      border-color: var(--accent);
      background: #fff
    }

    .gate-btn {
      width: 100%;
      margin-top: 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 11px;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer
    }

    .gate-btn:hover {
      background: #1B308C
    }

    .gate-err {
      min-height: 18px;
      margin-top: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--danger)
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: #fff;
      padding: 11px 18px;
      border-radius: 11px;
      font-size: 13.5px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 210
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0)
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important
      }
    }

    @media print {

      .connbar,
      .monthbar .nav,
      .toast {
        display: none !important
      }

      .cal {
        box-shadow: none;
        border-color: #999
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="app">
      <div class="brand">
        <img class="logo" id="hdrLogo" alt="Báo Thanh Niên">
        <h1>LỊCH TRỰC TÒA SOẠN TỔNG HỢP</h1>
        <p>Bấm vào một ngày để xem chi tiết danh sách trực.</p>
      </div>
    </header>

    <div class="connbar" id="connbar"></div>

    <div class="monthbar">
      <div class="title" id="monthTitle">—</div>
      <div class="nav">
        <button class="iconbtn" id="prevM" title="Tháng trước"><svg viewBox="0 0 24 24" fill="none"
            stroke="currentColor">
            <path d="M15 18l-6-6 6-6" />
          </svg></button>
        <button class="btn" id="todayBtn">Hôm nay</button>
        <button class="iconbtn" id="nextM" title="Tháng sau"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M9 18l6-6-6-6" />
          </svg></button>
        <button class="btn" id="btnRefresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M21 12a9 9 0 11-3-6.7L21 8M21 4v4h-4" />
          </svg>Làm mới</button>
      </div>
    </div>

    <div class="cal">
      <div class="dow"><span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span
          class="we">T7</span><span class="we">CN</span></div>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <dialog id="dayDlg">
    <div class="dvhead">
      <div>
        <div class="dvdate" id="dvDate">—</div>
        <div class="dvlunar" id="dvLunar"></div>
      </div>
      <button class="dvclose" id="dvClose" aria-label="Đóng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg></button>
    </div>
    <div class="dvbody" id="dvBody"></div>
    <div class="dvfoot"><button class="btn" id="dvCloseBtn">Đóng</button></div>
  </dialog>

  <div class="gate" id="gate" style="display:none">
    <div class="gate-card">
      <img class="gate-logo" id="gateLogo" alt="Thanh Niên">
      <div class="gate-title">LỊCH TRỰC TÒA SOẠN TỔNG HỢP</div>
      <div class="gate-checking" id="gateChecking">Đang kiểm tra…</div>
      <div class="gate-form" id="gateForm" style="display:none">
        <div class="gate-label">Nhập mã xem (6 chữ số)</div>
        <input class="gate-input" id="gateInput" inputmode="numeric" maxlength="6" placeholder="••••••"
          autocomplete="off">
        <button class="gate-btn" id="gateSubmit">Vào xem</button>
        <div class="gate-err" id="gateErr"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (function () {
      "use strict";

      // ====== CẤU HÌNH MÁY CHỦ (Google Sheets qua Apps Script) ======
      // DÁN URL Web App (kết thúc bằng /exec) vào giữa hai dấu nháy dưới đây:

      const LS_URL = "lichtruc2.url", LS_VIEW = "lichtruc2.view", LS_CACHE = "lichtruc2.cache";

      function key(y, m, d) { return `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`; }
      function todayKey() { const t = new Date(); return key(t.getFullYear(), t.getMonth(), t.getDate()); }

      // ---------- Âm lịch (Hồ Ngọc Đức, TZ=7) ----------
      const TZ = 7, PI = Math.PI, INT = Math.floor;
      function jdFromDate(dd, mm, yy) { const a = INT((14 - mm) / 12), y = yy + 4800 - a, m = mm + 12 * a - 3; let jd = dd + INT((153 * m + 2) / 5) + 365 * y + INT(y / 4) - INT(y / 100) + INT(y / 400) - 32045; if (jd < 2299161) jd = dd + INT((153 * m + 2) / 5) + 365 * y + INT(y / 4) - 32083; return jd; }

      function SunLong(jdn) { const T = (jdn - 2451545.5 - TZ / 24) / 36525, T2 = T * T, dr = PI / 180; const M = 357.52910 + 35999.05030 * T - 0.0001559 * T2 - 0.00000048 * T * T2; const L0 = 280.46645 + 36000.76983 * T + 0.0003032 * T2; let DL = (1.914600 - 0.004817 * T - 0.000014 * T2) * Math.sin(dr * M); DL += (0.019993 - 0.000101 * T) * Math.sin(2 * dr * M) + 0.000290 * Math.sin(3 * dr * M); let L = (L0 + DL) * dr; L = L - PI * 2 * INT(L / (PI * 2)); return INT(L / PI * 6); }

      function issueNo(y, m, d) { const nd = new Date(Date.UTC(y, m - 1, d + 1)); const y2 = nd.getUTCFullYear(); return Math.floor((Date.UTC(y2, nd.getUTCMonth(), nd.getUTCDate()) - Date.UTC(y2, 0, 1)) / 86400000) + 1; }
      function issueStr(y, m, d) { return String(issueNo(y, m, d)).padStart(3, "0"); }

      // ---------- Ngày lễ / sự kiện ----------
      const HOL_SOLAR = { "1-1": "Tết Dương lịch", "4-30": "Ngày Thống nhất đất nước", "5-1": "Ngày Quốc tế Lao động", "9-2": "Quốc khánh", "11-24": "Ngày Văn hóa Việt Nam" };
      const EVT_SOLAR = { "2-3": "Thành lập Đảng", "2-27": "Ngày thầy thuốc", "3-8": "QT Phụ nữ", "3-26": "Thành lập Đoàn", "5-7": "Chiến thắng ĐBP", "5-19": "Sinh nhật Bác", "6-1": "QT Thiếu nhi", "6-28": "Ngày Gia đình Việt Nam", "7-27": "Ngày Thương binh – Liệt sĩ", "7-28": "Thành lập Công đoàn VN", "8-19": "CMT8 - CAND", "10-10": "Giải phóng Thủ đô", "10-20": "Ngày Phụ nữ Việt Nam", "11-20": "Ngày Nhà giáo Việt Nam", "12-22": "Thành lập QĐND" };
      function vnHoliday(y, m, d) {
        const l = solar2lunar(d, m, y);
        if (l.month === 1 && l.day >= 1 && l.day <= 3) return { name: "Tết Nguyên đán – mồng " + l.day, kind: "holiday" };
        if (l.month === 12) { const nd = new Date(Date.UTC(y, m - 1, d + 1)); const nl = solar2lunar(nd.getUTCDate(), nd.getUTCMonth() + 1, nd.getUTCFullYear()); if (nl.month === 1 && nl.day === 1) return { name: "Tết Nguyên đán – Giao thừa", kind: "holiday" }; }
        if (l.month === 3 && l.day === 10) return { name: "Giỗ Tổ", kind: "holiday" };

      // ---------- Lịch ----------
      const grid = document.getElementById("grid"), monthTitle = document.getElementById("monthTitle");
      function render() {
        const y = view.getFullYear(), m = view.getMonth();

        grid.innerHTML = "";

        const daysIn = new Date(y, m + 1, 0).getDate(); const tKey = todayKey();

          dvBody.appendChild(b);
        }
        const hol = vnHoliday(y, m, d);
        if (hol) { const hb = document.createElement("div"); hb.className = "dv-holiday " + (hol.kind === "holiday" ? "h" : "e"); hb.innerHTML = `<span class="dot2"></span><span>${hol.kind === "holiday" ? "Ngày nghỉ lễ: " : "Sự kiện: "}${escapeHtml(hol.name)}</span>`; dvBody.appendChild(hb); }
        let any = false;
        state.groups.forEach(g => {
          const list = posInGroup(g.id); if (list.length === 0) return;
          const block = document.createElement("div"); block.className = "dv-grp";
          const gh = document.createElement("div"); gh.className = "dv-gh"; gh.style.borderColor = g.color + "55";
          gh.innerHTML = `<span class="dot" style="background:${g.color}"></span><span class="gn" style="color:${g.color}">${escapeHtml(g.name)}</span>`;
          block.appendChild(gh);
          if (g.showIssue) { const iss = document.createElement("div"); iss.className = "dv-issue"; iss.innerHTML = `Trực số báo in: <b>${issueStr(y, m, d)}</b>`; block.appendChild(iss); }
          list.forEach(pos => {
            const person = (asg[pos.id] || "").trim(); if (person) any = true;
            const row = document.createElement("div"); row.className = "dv-row";
            row.innerHTML = `<span class="dv-pos">${escapeHtml(pos.name)}</span><span class="dv-person${person ? "" : " empty"}">${person ? escapeHtml(person) : "— chưa phân —"}</span>`;
            block.appendChild(row);
          });
          dvBody.appendChild(block);
        });
        if (!any) { const e = document.createElement("div"); e.className = "dv-empty"; e.textContent = "Chưa phân trực cho ngày này."; const nm = dvBody.querySelector(".dv-nomeet"); dvBody.insertBefore(e, nm ? nm.nextSibling : dvBody.firstChild); }
        if ((state.notes[k] || "").trim()) { const n = document.createElement("div"); n.className = "dv-note"; n.innerHTML = `<b>Lưu ý</b>${escapeHtml(state.notes[k])}`; dvBody.appendChild(n); }
      }
      function openDay(k) { selected = k; buildDay(k); dayDlg.showModal(); }

      // ---------- Trạng thái kết nối ----------
      const connbar = document.getElementById("connbar");
      function paintConn(msg) {
        if (!connected()) { connbar.className = "connbar st-local"; connbar.innerHTML = `<span class="cdot"></span><span class="cmsg">Chưa kết nối máy chủ — hãy dán URL vào file.</span>`; return; }
        connbar.className = "connbar st-view";
        connbar.innerHTML = `<span class="cdot"></span><span class="cmsg">Đang xem lịch trực chung (tự cập nhật từ Google Sheet).</span><span class="csync">${msg || ""}</span>`;
      }
      function setSync(m) { const el = connbar.querySelector(".csync"); if (el) el.textContent = m; else paintConn(m); }

      // ---------- Cổng mã xem ----------
      const gate = document.getElementById("gate"), gateChecking = document.getElementById("gateChecking"),
        gateForm = document.getElementById("gateForm"), gateInput = document.getElementById("gateInput"), gateErr = document.getElementById("gateErr");
      function showGate(mode) { gate.style.display = "flex"; if (mode === "checking") { gateChecking.style.display = "block"; gateForm.style.display = "none"; } else { gateChecking.style.display = "none"; gateForm.style.display = "block"; gateErr.textContent = ""; setTimeout(() => gateInput.focus(), 40); } }
      function hideGate() { gate.style.display = "none"; }
      async function submitGate() {
        const c = (gateInput.value || "").trim();
        if (!/^\d{6}$/.test(c)) { gateErr.textContent = "Mã gồm đúng 6 chữ số."; return; }
        viewCode = c; localStorage.setItem(LS_VIEW, c);
        gateErr.textContent = "Đang kiểm tra…";
        await pull(false);
        if (!gatePassed) gateErr.textContent = "Mã xem không đúng.";
      }
      document.getElementById("gateSubmit").onclick = submitGate;
      gateInput.addEventListener("keydown", e => { if (e.key === "Enter") submitGate(); });

      // ---------- Đọc dữ liệu ----------
      async function pull(initial) {
        if (!connected()) { paintConn(); return; }
        if (pulling) return; pulling = true; setSync("Đang tải…");
        try {
          let url = SERVER_URL + (SERVER_URL.includes("?") ? "&" : "?") + "t=" + Date.now();
          if (viewCode) url += "&k=" + encodeURIComponent(viewCode);
          const res = await fetch(url, { method: "GET", redirect: "follow" });
          const text = await res.text();
          let j;
          try { j = JSON.parse(text); } catch (pe) {
            // Google Apps Script có thể trả về HTML thay vì JSON khi có lỗi
            console.error("Phản hồi không phải JSON:", text.substring(0, 200));
            throw new Error("Phản hồi không phải JSON");
          }
          if (j && j.ok) {
            gatePassed = true; hideGate();
            if (j.data && j.data.groups) { state = j.data; cache(); }
            paintConn("Đã cập nhật"); render();
            if (dayDlg.open && selected) buildDay(selected);
          } else if (j && j.error === "locked") { gatePassed = false; showGate("input"); }
          else { hideGate(); setSync("Lỗi dữ liệu"); }
        } catch (e) {
          console.error("Lỗi kết nối:", e);
          // ẨN GATE để không bị frozen mãi ở "Đang kiểm tra…"
          hideGate();
          setSync(initial ? "Không tải được — hiển thị bản đã lưu" : "Mất kết nối");
          if (initial) paintConn();
        }
        pulling = false;
      }

      // ---------- Điều hướng ----------
      document.getElementById("prevM").onclick = () => { view.setMonth(view.getMonth() - 1); render(); };
      document.getElementById("nextM").onclick = () => { view.setMonth(view.getMonth() + 1); render(); };
      document.getElementById("todayBtn").onclick = () => { const t = new Date(); view = new Date(t.getFullYear(), t.getMonth(), 1); render(); openDay(todayKey()); };
      document.getElementById("btnRefresh").onclick = () => { if (connected()) pull(false); };
      document.addEventListener("keydown", e => { if (gate.style.display !== "none" || dayDlg.open) return; if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return; if (e.key === "ArrowLeft") { view.setMonth(view.getMonth() - 1); render(); } if (e.key === "ArrowRight") { view.setMonth(view.getMonth() + 1); render(); } });

      // ---------- Khởi tạo ----------
      paintConn(); render();
      if (connected()) { showGate("checking"); pull(true); }
      setInterval(() => { if (connected() && gatePassed && !dayDlg.open && !document.hidden) pull(false); }, 120000);
      let lastVis = 0;
      document.addEventListener("visibilitychange", () => { if (document.hidden || !connected() || !gatePassed) return; const now = Date.now(); if (now - lastVis < 15000) return; lastVis = now; pull(false); });
    })();
  </script>
</body>
